name: Deploy Contract to Testnet

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy RestaurantContract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32v1-none
          override: true

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Generate deployer identity
        run: |
          stellar keys generate deployer --network testnet --fund
          echo "DEPLOYER=$(stellar keys address deployer)" >> $GITHUB_ENV
          sleep 15
          curl -sf "https://horizon-testnet.stellar.org/accounts/$(stellar keys address deployer)" | head -c 200

      - name: Build contract
        run: stellar contract build --manifest-path contracts/restaurant/Cargo.toml

      - name: Deploy contract
        id: deploy
        run: |
          WASM="target/wasm32v1-none/release/restaurant_contract.wasm"
          ls -la "$WASM"
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt..."
            OUTPUT=$(stellar contract deploy \
              --wasm "$WASM" \
              --source deployer \
              --network testnet 2>&1) || true
            echo "$OUTPUT"
            CONTRACT_ID=$(echo "$OUTPUT" | grep -oE 'C[A-Z2-7]{55}' | tail -1)
            if [ -n "$CONTRACT_ID" ]; then
              echo "contract_id=$CONTRACT_ID" >> $GITHUB_OUTPUT
              echo "CONTRACT_ID=$CONTRACT_ID"
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Initialize contract
        id: init
        run: |
          TX=$(stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract_id }}" \
            --source deployer \
            --network testnet \
            -- init \
            --owner "$(stellar keys address deployer)" \
            --name "Arc Nexus")
          echo "init_tx=$TX" >> $GITHUB_OUTPUT

      - name: Write deployment info
        run: |
          mkdir -p deployment
          cat > deployment/testnet.json <<EOF
          {
            "contractId": "${{ steps.deploy.outputs.contract_id }}",
            "initTx": "${{ steps.init.outputs.init_tx }}",
            "network": "testnet",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat deployment/testnet.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: testnet-deployment
          path: deployment/testnet.json

      - name: Summary
        run: |
          echo "## Testnet Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Contract ID: \`${{ steps.deploy.outputs.contract_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Init TX: \`${{ steps.init.outputs.init_tx }}\`" >> $GITHUB_STEP_SUMMARY
